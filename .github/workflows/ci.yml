name: CI
on:
  pull_request:
  push:
    branches: [main, codex/neon-royale]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: RUN_INTEGRATION_TESTS=true npm run check
      - name: Smoke test production server
        env:
          ADMIN_TOKEN: ci-smoke-admin-token
        run: |
          MOCK_MODE=true npm start > /tmp/startrades-server.log 2>&1 &
          SERVER_PID=$!
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/api/health; then
              kill $SERVER_PID
              wait $SERVER_PID || true
              exit 0
            fi
            sleep 1
          done
          cat /tmp/startrades-server.log
          kill $SERVER_PID || true
          wait $SERVER_PID || true
          exit 1
