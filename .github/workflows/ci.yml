name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, codex/neon-royale]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Passagem 1 — arquitetura, testes, integração e segurança
        run: RUN_INTEGRATION_TESTS=true npm run check
      - name: npm audit
        run: npm audit --audit-level=high

      - name: Passagem 2 — produção HTTP e WebSocket
        env:
          ADMIN_TOKEN: ci-smoke-admin-token
          MOCK_MODE: 'true'
          BATTLE_COUNTDOWN_MS: '0'
          SUPABASE_URL: ''
          SUPABASE_SECRET_KEY: ''
          OTEL_EXPORTER_OTLP_ENDPOINT: ''
        run: |
          npm run build
          npm start > /tmp/startrades-server.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill $SERVER_PID 2>/dev/null || true; wait $SERVER_PID 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/api/health >/tmp/health.json; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          curl --fail --silent http://127.0.0.1:4173/control >/dev/null
          curl --fail --silent http://127.0.0.1:4173/api/health >/dev/null
          curl --fail --silent http://127.0.0.1:4173/api/config >/dev/null
          curl --fail --silent http://127.0.0.1:4173/api/leaderboard >/dev/null
          node --input-type=module <<'NODE'
          import { WebSocket } from 'ws';
          const ws = new WebSocket('ws://127.0.0.1:4173/events');
          const timeout = setTimeout(() => { console.error('websocket timeout'); process.exit(1); }, 4000);
          ws.once('message', (raw) => {
            const event = JSON.parse(String(raw));
            if (event.type !== 'state' || !event.state) process.exit(1);
            clearTimeout(timeout);
            ws.close();
          });
          ws.once('error', (error) => { console.error(error); process.exit(1); });
          ws.once('close', () => process.exit(0));
          NODE
          cat /tmp/health.json

      - name: Passagem 3 — repetir suíte final completa
        run: RUN_INTEGRATION_TESTS=true npm run check

  panel-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:panel
      - name: Upload visual and browser QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-qa-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  gameplay-large:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:gameplay:1000

  audit-fix-bootstrap:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/neon-royale' && contains(github.event.head_commit.message, '[audit-fix-bootstrap]')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply reviewed audit fixes
        run: python3 qa/audit-fix-bootstrap.py
      - name: ESLint final audit
        run: npm run lint
      - name: UTF-8 and mojibake audit
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync, statSync } from 'node:fs';
          import { extname, join } from 'node:path';
          const roots = ['server', 'src'];
          const extensions = new Set(['.js', '.jsx', '.css', '.json', '.html', '.md']);
          const files = [];
          const walk = (dir) => {
            for (const name of readdirSync(dir)) {
              const path = join(dir, name);
              if (statSync(path).isDirectory()) walk(path);
              else if (extensions.has(extname(path))) files.push(path);
            }
          };
          roots.forEach(walk);
          const decoder = new TextDecoder('utf-8', { fatal: true });
          const issues = [];
          for (const file of files) {
            let text;
            try { text = decoder.decode(readFileSync(file)); }
            catch (error) { issues.push(`${file}: invalid UTF-8: ${error.message}`); continue; }
            for (const marker of ['\uFFFD', 'Ã', 'Â', 'ð']) {
              if (text.includes(marker)) issues.push(`${file}: suspicious mojibake marker ${JSON.stringify(marker)}`);
            }
          }
          if (issues.length) {
            console.error(issues.join('\n'));
            process.exit(1);
          }
          console.log(`ENCODING_OK ${files.length} text files scanned`);
          NODE
      - name: Full regression validation
        run: RUN_INTEGRATION_TESTS=true npm run check
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Diff hygiene
        run: git diff --check
      - name: Commit audited fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: add eslint and harden audited paths [skip render]"
          git push origin HEAD:codex/neon-royale
